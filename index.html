<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Delay Cam</title>
  <style>
    :root {
      --bg: #000;
      --panel: rgba(12, 12, 14, 0.78);
      --text: #fff;
      --muted: rgba(255,255,255,.65);
      --accent: #0a84ff;
      --danger: #ff453a;
      --track: rgba(255,255,255,.25);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #previewVideo { z-index: 1; }
    #playbackVideoA, #playbackVideoB { z-index: 2; display: none; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        calc(env(safe-area-inset-top) + 10px)
        12px
        calc(env(safe-area-inset-bottom) + 12px);
      transition: opacity .18s ease;
      pointer-events: none;
    }

    .overlay.hidden {
      opacity: 0;
    }

    .topbar,
    .controls {
      pointer-events: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 10px 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: #8e8e93;
    }

    .dot.recording {
      background: var(--danger);
      box-shadow: 0 0 0 5px rgba(255,69,58,.18);
      animation: pulse 1.3s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .45; }
    }

    .statusText {
      min-width: 0;
    }

    .statusText strong,
    .statusText span {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .statusText strong { font-size: 14px; }
    .statusText span { font-size: 12px; color: var(--muted); margin-top: 1px; }

    button {
      appearance: none;
      border: 0;
      border-radius: 13px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font: inherit;
      font-weight: 650;
      padding: 11px 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }

    .primary { background: var(--accent); }
    .danger { background: var(--danger); }

    .controls {
      background: var(--panel);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 22px;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .timeRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .timeRow strong {
      color: #fff;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    #scrubber {
      width: 100%;
      accent-color: #fff;
    }

    .buttonRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    #clipPanel {
      display: none;
      gap: 10px;
      padding-top: 2px;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    #clipPanel.visible { display: grid; }

    .clipTitle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .clipTimes {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .clipSliderWrap {
      position: relative;
      height: 32px;
    }

    .clipSliderWrap input {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      pointer-events: none;
      background: transparent;
    }

    .clipSliderWrap input::-webkit-slider-runnable-track {
      height: 6px;
      background: rgba(255,255,255,.22);
      border-radius: 999px;
    }

    .clipSliderWrap input::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -8px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #111;
      box-shadow: 0 1px 5px rgba(0,0,0,.5);
    }

    .clipButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #saveClipBtn { background: #30d158; color: #000; }
    #saveClipBtn:disabled { background: rgba(255,255,255,.14); color: #fff; }

    .clipNote {
      font-size: 10px;
      line-height: 1.35;
      color: var(--muted);
      text-align: center;
    }

    #tapCatcher {
      position: absolute;
      inset: 0;
      z-index: 5;
    }

  </style>
</head>
<body>
  <div id="app">
    <video id="previewVideo" autoplay muted playsinline></video>
    <video id="playbackVideoA" playsinline muted></video>
    <video id="playbackVideoB" playsinline muted></video>
    <div id="tapCatcher"></div>

    <div id="overlay" class="overlay">
      <div class="topbar">
        <div class="status">
          <div id="statusDot" class="dot"></div>
          <div class="statusText">
            <strong id="statusTitle">Not recording</strong>
            <span id="statusSub">10:00 rolling delay buffer</span>
          </div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="liveBtn" disabled>Live</button>
        </div>
      </div>

      <div class="controls">
        <div class="timeRow">
          <span>Oldest</span>
          <strong id="playheadLabel">LIVE</strong>
          <span>Live</span>
        </div>

        <input id="scrubber" type="range" min="0" max="1000" value="1000" disabled />

        <div class="timeRow">
          <span id="bufferLabel">Buffer 00:00</span>
          <span id="delayLabel">Delay 00:00</span>
        </div>

        <div class="buttonRow">
          <button id="pauseBtn" disabled>Pause</button>
          <button id="resumeBtn" disabled>Resume</button>
        </div>

        <div id="clipPanel">
          <div class="clipTitle">
            <span>Clip</span>
            <span id="clipDuration">00:00</span>
          </div>
          <div class="clipSliderWrap">
            <input id="clipStart" type="range" min="0" max="1000" value="0" aria-label="Clip start">
            <input id="clipEnd" type="range" min="0" max="1000" value="1000" aria-label="Clip end">
          </div>
          <div class="clipTimes">
            <span>Start <strong id="clipStartLabel">00:00</strong></span>
            <span>End <strong id="clipEndLabel">00:00</strong></span>
          </div>
          <div class="clipButtons">
            <button id="cancelClipBtn">Cancel</button>
            <button id="saveClipBtn" disabled>SAVE</button>
          </div>
          <div class="clipNote">Select both ends, then SAVE. iPhone may show the share sheet; choose “Save Video” to put it in Photos.</div>
        </div>

        <div class="hint">Tap the video to hide or restore all controls.</div>
      </div>
    </div>


  </div>

<script>
(() => {
  /*
   * Architecture:
   * - The camera always records into a rolling 10-minute buffer.
   * - Live mode displays the camera stream directly.
   * - Scrubbing creates a stable playback snapshot of the buffer. We NEVER
   *   replace that video source every second, which was causing the black flashes.
   * - Pause/resume controls the VIEWER, not the recorder. Recording continues
   *   in the background, so pause is immediate at the exact frame being watched.
   */
  const BUFFER_MS = 10 * 60 * 1000;
  const CHUNK_MS = 1000;

  const previewVideo = document.getElementById('previewVideo');
  const playbackVideoA = document.getElementById('playbackVideoA');
  const playbackVideoB = document.getElementById('playbackVideoB');
  const playbackVideos = [playbackVideoA, playbackVideoB];
  let activePlaybackIndex = 0;
  let playbackVideo = playbackVideos[0];
  const overlay = document.getElementById('overlay');
  const tapCatcher = document.getElementById('tapCatcher');
  const pauseBtn = document.getElementById('pauseBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  const liveBtn = document.getElementById('liveBtn');
  const scrubber = document.getElementById('scrubber');
  const statusDot = document.getElementById('statusDot');
  const statusTitle = document.getElementById('statusTitle');
  const statusSub = document.getElementById('statusSub');
  const bufferLabel = document.getElementById('bufferLabel');
  const delayLabel = document.getElementById('delayLabel');
  const playheadLabel = document.getElementById('playheadLabel');
  const clipPanel = document.getElementById('clipPanel');
  const clipStart = document.getElementById('clipStart');
  const clipEnd = document.getElementById('clipEnd');
  const clipStartLabel = document.getElementById('clipStartLabel');
  const clipEndLabel = document.getElementById('clipEndLabel');
  const clipDuration = document.getElementById('clipDuration');
  const saveClipBtn = document.getElementById('saveClipBtn');
  const cancelClipBtn = document.getElementById('cancelClipBtn');

  let stream, recorder, chunks = [];
  let recordingStartedAt = 0;
  let playbackUrl = null;
  let mode = 'live'; // live | playback
  let viewerPaused = false;
  let controlsHidden = false;
  let selectedDelayMs = 0;
  let loadingPlayback = false;
  let clipStartMs = 0;
  let clipEndMs = 0;

  const fmt = ms => {
    const n = Math.max(0, Math.floor(ms / 1000));
    return `${String(Math.floor(n / 60)).padStart(2,'0')}:${String(n % 60).padStart(2,'0')}`;
  };

  function elapsed() { return recordingStartedAt ? Date.now() - recordingStartedAt : 0; }
  function availableBufferMs() {
    if (!chunks.length) return 0;
    return Math.max(0, chunks[chunks.length - 1].end - chunks[0].start);
  }
  function prune() {
    const newest = chunks.at(-1)?.end;
    if (newest == null) return;
    const cutoff = newest - BUFFER_MS;
    while (chunks.length > 1 && chunks[0].end < cutoff) chunks.shift();
  }

  function updateUI() {
    const avail = availableBufferMs();
    bufferLabel.textContent = `Buffer ${fmt(avail)}`;
    delayLabel.textContent = `Delay ${fmt(selectedDelayMs)}`;
    playheadLabel.textContent = mode === 'live' ? 'LIVE' : (viewerPaused ? 'PAUSED' : `-${fmt(selectedDelayMs)}`);
    pauseBtn.disabled = !recorder || viewerPaused;
    resumeBtn.disabled = !recorder || !viewerPaused;
    liveBtn.disabled = !recorder;
    scrubber.disabled = !recorder || avail < 500;
    statusDot.className = recorder ? 'dot recording' : 'dot';
    statusTitle.textContent = viewerPaused ? 'Viewing paused' : 'Recording';
    statusSub.textContent = viewerPaused ? 'Recording continues in background' : '10:00 rolling buffer';
    if (clipPanel.classList.contains('visible')) updateClipUI();
  }

  function blobFromBuffer() {
    if (!chunks.length) return null;
    const type = chunks[0].blob.type || recorder?.mimeType || 'video/mp4';
    return new Blob(chunks.map(x => x.blob), { type });
  }

  async function loadSnapshot(delayMs, autoplay = true) {
    if (loadingPlayback) return;
    const blob = blobFromBuffer();
    if (!blob) return;
    loadingPlayback = true;
    selectedDelayMs = Math.min(delayMs, availableBufferMs());
    mode = 'playback';

    const newUrl = URL.createObjectURL(blob);
    const oldUrl = playbackUrl;
    const targetVideo = playbackVideo;
    const otherVideo = playbackVideos[activePlaybackIndex === 0 ? 1 : 0];
    try {
      targetVideo.pause();
      targetVideo.src = newUrl;
      targetVideo.style.display = 'block';
      targetVideo.style.visibility = 'visible';
      otherVideo.style.display = 'none';
      previewVideo.style.visibility = 'hidden';
      await new Promise(resolve => {
        const finish = () => resolve();
        targetVideo.addEventListener('loadedmetadata', finish, {once:true});
        targetVideo.addEventListener('error', finish, {once:true});
        targetVideo.load();
      });
      if (Number.isFinite(targetVideo.duration) && targetVideo.duration > 0) {
        const target = Math.max(0, targetVideo.duration - selectedDelayMs / 1000);
        targetVideo.currentTime = target;
      }
      playbackUrl = newUrl;
      playbackVideo = targetVideo;
      if (oldUrl) URL.revokeObjectURL(oldUrl);
      viewerPaused = !autoplay;
      if (viewerPaused) showClipPanel(); else hideClipPanel();
      if (autoplay) { try { await targetVideo.play(); } catch {} }
    } finally {
      if (playbackUrl !== newUrl) URL.revokeObjectURL(newUrl);
      loadingPlayback = false;
      updateUI();
    }
  }

  function goLive() {
    mode = 'live'; viewerPaused = false; selectedDelayMs = 0; hideClipPanel();
    playbackVideos.forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); v.style.display = 'none'; });
    previewVideo.style.visibility = 'visible';
    if (playbackUrl) { URL.revokeObjectURL(playbackUrl); playbackUrl = null; }
    scrubber.value = 1000;
    updateUI();
  }

  function pauseViewer() {
    if (mode === 'live') {
      // Freeze the exact current moment by making a playback snapshot at live.
      loadSnapshot(0, false);
    } else {
      playbackVideo.pause(); viewerPaused = true; showClipPanel(); updateUI();
    }
  }
  async function resumeViewer() {
    if (!viewerPaused) return;
    viewerPaused = false;
    hideClipPanel();
    if (mode === 'playback') { try { await playbackVideo.play(); } catch {} }
    updateUI();
  }

  // A snapshot is immutable, so when it reaches the end we refresh it.
  // IMPORTANT: wait until the recorder has produced roughly one full delay
  // of NEW footage before swapping. That makes the new snapshot's delayed
  // position line up with the frame we just reached instead of jumping/
  // flashing black every few seconds.
  let refreshBusy = false;

  async function prepareSnapshot(video, delayMs) {
    const blob = blobFromBuffer();
    if (!blob) return null;
    const url = URL.createObjectURL(blob);
    video.pause();
    video.src = url;
    video.load();

    await new Promise(resolve => {
      const done = () => resolve();
      video.addEventListener('loadedmetadata', done, {once:true});
      video.addEventListener('error', done, {once:true});
    });

    if (!Number.isFinite(video.duration) || video.duration <= 0) {
      URL.revokeObjectURL(url);
      return null;
    }

    video.currentTime = Math.max(0, video.duration - delayMs / 1000);
    return url;
  }

  async function refreshDelayedPlayback() {
    if (refreshBusy || viewerPaused || mode !== 'playback' || selectedDelayMs < 800) return;
    refreshBusy = true;

    const oldVideo = playbackVideo;
    const oldUrl = playbackUrl;
    const nextIndex = activePlaybackIndex === 0 ? 1 : 0;
    const nextVideo = playbackVideos[nextIndex];
    const delayAtRefresh = selectedDelayMs;

    try {
      const nextUrl = await prepareSnapshot(nextVideo, delayAtRefresh);
      if (!nextUrl || viewerPaused || mode !== 'playback') {
        if (nextUrl) URL.revokeObjectURL(nextUrl);
        return;
      }

      // The old video stays visible while the new snapshot is prepared.
      // Swap only after metadata and the exact delayed frame are ready.
      nextVideo.style.display = 'block';
      nextVideo.style.visibility = 'hidden';

      try { await nextVideo.play(); } catch {}

      oldVideo.style.visibility = 'hidden';
      nextVideo.style.visibility = 'visible';
      oldVideo.style.display = 'none';
      oldVideo.pause();

      playbackVideo = nextVideo;
      activePlaybackIndex = nextIndex;
      playbackUrl = nextUrl;
      if (oldUrl) URL.revokeObjectURL(oldUrl);
      updateUI();
    } finally {
      refreshBusy = false;
    }
  }

  playbackVideoA.addEventListener('ended', () => {
    if (playbackVideo === playbackVideoA && !viewerPaused && mode === 'playback') refreshDelayedPlayback();
  });
  playbackVideoB.addEventListener('ended', () => {
    if (playbackVideo === playbackVideoB && !viewerPaused && mode === 'playback') refreshDelayedPlayback();
  });

  scrubber.addEventListener('input', () => {
    const avail = availableBufferMs();
    selectedDelayMs = avail * ((1000 - Number(scrubber.value)) / 1000);
    delayLabel.textContent = `Delay ${fmt(selectedDelayMs)}`;
    playheadLabel.textContent = selectedDelayMs < 1000 ? 'LIVE' : `-${fmt(selectedDelayMs)}`;
  });
  scrubber.addEventListener('change', async () => {
    if (selectedDelayMs < 800) { goLive(); return; }
    await loadSnapshot(selectedDelayMs, true);
  });

  function updateClipUI() {
    const avail = availableBufferMs();
    clipStartMs = Math.max(0, Math.min(clipStartMs, avail));
    clipEndMs = Math.max(clipStartMs, Math.min(clipEndMs, avail));
    clipStartLabel.textContent = fmt(clipStartMs);
    clipEndLabel.textContent = fmt(clipEndMs);
    clipDuration.textContent = fmt(Math.max(0, clipEndMs - clipStartMs));
    saveClipBtn.disabled = !recorder || chunks.length < 1 || clipEndMs <= clipStartMs || (clipEndMs - clipStartMs) < 500;
  }

  function showClipPanel() {
    const avail = availableBufferMs();
    if (avail < 500) return;
    // Start with a useful clip around the point currently being viewed.
    let center = mode === 'playback' && Number.isFinite(playbackVideo.currentTime)
      ? Math.max(0, Math.min(avail, (playbackVideo.currentTime / Math.max(0.001, playbackVideo.duration || 1)) * avail))
      : avail;
    const half = Math.min(5000, avail / 2);
    clipStartMs = Math.max(0, center - half);
    clipEndMs = Math.min(avail, center + half);
    clipStart.value = String(Math.round((clipStartMs / avail) * 1000));
    clipEnd.value = String(Math.round((clipEndMs / avail) * 1000));
    clipPanel.classList.add('visible');
    updateClipUI();
  }

  function hideClipPanel() {
    clipPanel.classList.remove('visible');
  }

  function syncClipSliders(changed) {
    const avail = availableBufferMs();
    if (!avail) return;
    let a = Number(clipStart.value) / 1000;
    let b = Number(clipEnd.value) / 1000;
    if (changed === 'start' && a > b - 0.005) {
      a = Math.max(0, b - 0.005);
      clipStart.value = String(Math.round(a * 1000));
    }
    if (changed === 'end' && b < a + 0.005) {
      b = Math.min(1, a + 0.005);
      clipEnd.value = String(Math.round(b * 1000));
    }
    clipStartMs = a * avail;
    clipEndMs = b * avail;
    updateClipUI();
  }

  function getClipBlob() {
    const avail = availableBufferMs();
    if (!chunks.length || clipEndMs <= clipStartMs) return null;
    const oldest = chunks[0].start;
    const newest = chunks.at(-1).end;
    const startAbs = oldest + clipStartMs;
    const endAbs = oldest + clipEndMs;
    const selected = chunks.filter(c => c.end > startAbs && c.start < endAbs);
    if (!selected.length) return null;
    const type = selected[0].blob.type || recorder?.mimeType || 'video/mp4';
    return new Blob(selected.map(c => c.blob), {type});
  }

  async function saveClip() {
    const blob = getClipBlob();
    if (!blob) return;
    saveClipBtn.disabled = true;
    const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
    const file = new File([blob], `delay-cam-${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`, {type: blob.type});
    try {
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file], title:'Delay Cam Clip'});
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }
    } catch (e) {
      // User cancelling the iOS share sheet is not an error.
      if (e?.name !== 'AbortError') console.error('Clip save failed:', e);
    } finally {
      saveClipBtn.disabled = false;
    }
  }

  function chooseMime() {
    const list = ['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp8,opus','video/webm'];
    return list.find(x => MediaRecorder.isTypeSupported?.(x)) || '';
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:60}},
        audio:false
      });
      previewVideo.srcObject = stream;
      await previewVideo.play();
      const mime = chooseMime();
      recorder = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
      recordingStartedAt = Date.now(); chunks = [];
      recorder.ondataavailable = e => {
        if (!e.data?.size) return;
        const end = elapsed();
        const start = chunks.at(-1)?.end ?? Math.max(0,end-CHUNK_MS);
        chunks.push({blob:e.data,start,end}); prune();
      };
      recorder.start(CHUNK_MS);
      updateUI();
    } catch (e) { console.error(e); alert('Camera could not start: ' + (e.message || e)); }
  }

  pauseBtn.addEventListener('click', pauseViewer);
  resumeBtn.addEventListener('click', resumeViewer);
  liveBtn.addEventListener('click', goLive);
  tapCatcher.addEventListener('click', () => { controlsHidden=!controlsHidden; overlay.classList.toggle('hidden',controlsHidden); });
  overlay.addEventListener('click', e=>e.stopPropagation());
  clipStart.addEventListener('input', () => syncClipSliders('start'));
  clipEnd.addEventListener('input', () => syncClipSliders('end'));
  saveClipBtn.addEventListener('click', saveClip);
  cancelClipBtn.addEventListener('click', hideClipPanel);

  window.addEventListener('load', startCamera, {once:true});
  setInterval(() => { if (recorder) { prune(); updateUI(); } }, 500);
})();
</script>
</body>
</html>
